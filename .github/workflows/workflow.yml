name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout Markdown parser
        uses: actions/checkout@v4
        with:
          repository: Erchiusx/ErchiusxMarkdown
          ref: personal
          path: .tools/erchiusx-markdown
          persist-credentials: false

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          cabal-version: '3.14.2.0'

      - name: Cache Cabal dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-ghc-9.12.2-cabal-${{ hashFiles('.tools/erchiusx-markdown/erchiusx-markdown.cabal', '.tools/erchiusx-markdown/cabal.project') }}

      - name: Build Markdown parser
        working-directory: .tools/erchiusx-markdown
        run: |
          cabal update
          cabal build compiler
          mkdir -p ../bin
          cp "$(cabal list-bin compiler)" ../bin/compiler

      - name: Build site
        run: make build PARSER=.tools/bin/compiler

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
